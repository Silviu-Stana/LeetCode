<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- verifica raspunsuri la 5 intrebari folosind butoane Radio
     aplicatia va contine 1 camp cu numele persoanei -->

    <form
      action="http://localhost:8000/seal/intrebariSiRaspunsuri.php"
      method="post"
    >
      <fieldset>
        <div>
          <legend>1+1=?</legend>
          <label for="1a">2</label>
          <input type="radio" name="1" value="1" />
          <br />

          <label for="1b">6</label>
          <input type="radio" name="1" value="2" />
        </div>
      </fieldset>
      <br />

      <fieldset>
        <div>
          <legend>2x2=?</legend>
          <label for="2a">4</label>
          <input type="radio" name="2" value="1" />
          <br />

          <label for="2b">17</label>
          <input type="radio" name="2" value="2" />
        </div>
      </fieldset>

      <input type="submit" name="submit" value="Trimite Raspunsuri" />
    </form>
  </body>
</html>
